version: 4.3.0
canonical_timezone: America/New_York
canonical_skill: skill/ops-brief-policy/SKILL.md
runtime_engine: skill/ops-brief-policy/scripts/ops_policy.py
authority_registry: "private deployment state; public source stores no live resource IDs"

compatibility:
  purpose: "Legacy machine-readable entry point retained after main reconciliation."
  authority: "The canonical executable policy is the skill/runtime above; this file is a compact compatibility snapshot, not a second source of truth."

control_cycle:
  title: "LyfeOS Control Cycle"
  delivery_context: "standalone; each run starts from the saved prompt"
  times_et: ["02:45", "14:45"]
  production_clock_source: "runtime_system_clock; invoke slot-check without --now"
  output_identity: "first line is deterministic OPS-YYYY-MM-DD-AM|PM Run ID"
  pm_is_morning_brief: true
  phases: ["receipt_order_lifecycle", "reminder_reconciliation", "pm_qualified_job_watch", "ops_brief"]
  separate_active_dispatchers: false
  verification: "Read back title/enabled/cadence/TZID/timing/notifications/duplicates and require a subsequent actual firing or canonical Run Log entry before clearing a scheduler incident."

mode_resolution:
  priority:
    - "unexpired explicit Mode Override in Control"
    - "Active trip in Trips forces ROAD"
    - "weekly operating window"
  home_early:
    closes_current_mileage_accrual: true
    hold_home_through: "next Friday 14:45 ET brief"

appointments:
  saturday_am_weekly_horizon_days: 7
  never_show_confirmation_status: true
  reminder_planner: "skill/ops-brief-policy/scripts/reminder_policy.py"
  stock_reminders: ["day_before", "configured_morning_of", "60_minutes_before"]
  delivery: "Calendar projection; never one ChatGPT automation per appointment"

medication_reminders:
  default_enabled: false
  schedule_sources: ["explicit_owner", "prescription_label", "pharmacy", "clinician"]
  dose_or_timing_inference: false
  missed_dose_advice: false
  caregiver_sharing_default: false

mileage_pay:
  authority_ref: "resolve Mileage & Pay Tracker through the private Authority Registry"
  rate_per_paid_mile: null
  rate_source: "read from verified live mileage settings; never hard-code in public source"
  thursday_summary: true
  accrual_closes_on_confirmed_home_arrival: true
  terminal_paid_miles_symmetric_by_pair: true
  terminal_paid_miles_directional: false
  explicit_pair_exception_required_for_directional_difference: true
  failure_isolation:
    non_thursday: "Mileage read/shape/parse failure must not abort an otherwise valid brief."
    thursday: "Emit Action Required — mileage/pay Sheet unavailable and continue other sections."

receipts:
  one_receipt_id_per_transaction: true
  line_item_categories: true
  balanced_allocations: true
  part_sku_fitment_evidence_required_when_identifiable: true
  unknown_assignment: "queue; never guess"
  cancellation_is_not_refund: true
  unresolved_financial_correction_business_days: 5
  shopping_procurement: "active list; remove fulfilled intent after durable evidence/readback"

asset_evidence:
  reconciler: "skill/ops-brief-policy/scripts/asset_evidence.py"
  query_selectors: ["receipt_id", "entity_uuid", "namespaced_identifier"]
  normalized_tables: ["Evidence Index", "Asset Identifiers", "Knowledge Index", "Knowledge Relationships", "Technical Specifications"]
  user_projection: "Asset Browser"
  preserve_identifier_leading_zeroes: true
  safety_critical_specification_source: "authoritative tier plus exact subject/applicability/revision/page-or-section"

order_reconciliation:
  active_status_authority: "Ops Status Register Shipments"
  status_query_rule: "Enumerate active fulfillment from Shipments first. Orders - Database and Order Events are durable history/enrichment and must never resurrect an order absent from the active Shipments projection."
  owner_evidence_fallback:
    enabled: true
    trigger: "merchant/order email unavailable, not delivered to the connected mailbox, or connector evidence gap"
    behavior: "Explicit owner screenshot/chat confirmation is first-class evidence. Commit one canonical purchase/lifecycle identity immediately, project unresolved fulfillment as Awaiting Shipment, leave unavailable order number/tax/total/carrier/tracking/ETA blank, and enrich the same Receipt ID when later merchant/carrier evidence appears. Never wait for Gmail or invent missing fields."

email_actions:
  automatic_send: false
  automatic_delete: false
  archive_important_without_approval: false

change_control:
  repository: "configured deployment repository"
  git_required: true
  repository_visibility: "owner-selected; public requires source-audit PASS"
  automatic_commit_push_after_standing_authorization: true
  automatic_merge: false
