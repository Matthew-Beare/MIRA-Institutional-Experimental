name: Distribution CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: distribution-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m compileall -q scripts starter
      - run: python3 scripts/audit_public_source.py .
      - run: python3 scripts/audit_starter_privacy.py starter
      - run: python3 scripts/validate_distribution.py . --repository "${{ github.repository }}"
      - run: python3 starter/tools/behavior_dependency_check.py validate
      - run: python3 starter/tools/feature_reconciliation.py sync --check
      - run: python3 starter/tools/validate_feature_manifest.py --check-files
      - run: python3 -m unittest discover -s starter/tests -p 'test_*.py'
