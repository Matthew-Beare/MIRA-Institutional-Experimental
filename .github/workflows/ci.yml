name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m compileall -q scripts skill starter tests
      - run: python3 scripts/audit_public_source.py . --history
      - run: python3 scripts/audit_starter_privacy.py starter
      - run: python3 scripts/validate_repo.py .
      - run: python3 scripts/feature_catalog.py --check
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -m unittest discover -s skill/ops-brief-policy/scripts -p 'test_*.py'
      - run: python3 starter/tools/validate_feature_manifest.py --check-files
      - run: python3 -m unittest discover -s starter/tests -p 'test_*.py'
