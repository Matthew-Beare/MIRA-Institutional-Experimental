name: Promote Generated Distribution

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-generated-distribution.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 0b32512496865181ca3ba1e6bd1ce7f509e4fd5d
      CHANNEL: institutional-experimental
      EXPECTED_REPOSITORY: Matthew-Beare/MIRA-Institutional-Experimental
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out exact canonical source
        uses: actions/checkout@v4
        with:
          repository: Matthew-Beare/MIRA-Personal-Production
          ref: ${{ env.SOURCE_SHA }}
          path: canonical
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and fully validate generated tree
        run: |
          python3 canonical/scripts/build_distribution.py \
            --channel "$CHANNEL" \
            --source-revision "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/distribution"
          (
            cd "$RUNNER_TEMP/distribution"
            python3 scripts/audit_public_source.py .
            python3 scripts/audit_starter_privacy.py starter
            python3 scripts/validate_distribution.py . \
              --repository "$EXPECTED_REPOSITORY" \
              --channel "$CHANNEL" \
              --source-revision "$SOURCE_SHA"
            python3 -m compileall -q scripts starter
            python3 starter/tools/feature_reconciliation.py sync --check
            python3 starter/tools/validate_feature_manifest.py --check-files
            python3 -m unittest discover -s starter/tests -p 'test_*.py'
            find . -type d -name __pycache__ -prune -exec rm -rf -- {} +
            find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
            python3 scripts/audit_public_source.py .
            python3 scripts/audit_starter_privacy.py starter
            python3 scripts/validate_distribution.py . \
              --repository "$EXPECTED_REPOSITORY" \
              --channel "$CHANNEL" \
              --source-revision "$SOURCE_SHA"
          )
      - name: Replace non-workflow content with exact generated tree
        run: |
          cp -a "$GITHUB_WORKSPACE/.github" "$RUNNER_TEMP/current-github"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$RUNNER_TEMP/distribution/." "$GITHUB_WORKSPACE/"
          rm -rf "$GITHUB_WORKSPACE/.github"
          cp -a "$RUNNER_TEMP/current-github" "$GITHUB_WORKSPACE/.github"
      - name: Commit generated payload
        run: |
          git config user.name "M.I.R.R.O.R. Distribution Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Promote generated content from $SOURCE_SHA [skip ci]"
          git push origin HEAD:main
